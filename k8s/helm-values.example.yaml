# Example Helm values for deploying ibctl on Kubernetes.
#
# This is not a complete chart by itself. It is a reference values file for a
# simple chart that renders a Deployment, Service, optional Ingress, and Secret.
# Keep credentials in a Secret or external secret manager in real deployments.

replicaCount: 1

image:
  repository: ghcr.io/uranuswch/ibctl
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

nodeSelector: {}
tolerations: []
affinity: {}

persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  mountPath: /home/ibgateway/Jts/settings

service:
  type: ClusterIP
  annotations: {}
  ports:
    liveApi: 4003
    paperApi: 4004
    commandLive: 7462
    commandPaper: 7463
    dashboard: 8080
    novnc: 6080

dashboard:
  enabled: true
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: ibctl.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

env:
  DISPLAY: ":1"
  TRADING_MODE: live
  TWOFA_DEVICE: "IB Key"
  TWOFA_TIMEOUT_ACTION: restart
  TWOFA_EXIT_INTERVAL: "120"
  RELOGIN_AFTER_TWOFA_TIMEOUT: "yes"
  TWS_ACCEPT_INCOMING: accept
  TWS_MASTER_CLIENT_ID: ""
  READ_ONLY_API: "no"
  BYPASS_WARNING: "yes"
  ALLOW_BLIND_TRADING: "no"
  AUTO_RESTART_TIME: "09:05 PM"
  TWS_COLD_RESTART: ""
  JAVA_HEAP_SIZE: "768"
  TWS_SETTINGS_PATH: /home/ibgateway/Jts/settings
  TZ: America/New_York
  RUST_LOG: ibctl=info
  IBCTL_DASHBOARD_ENABLED: "true"
  IBCTL_DASHBOARD_PORT: "8080"
  IBCTL_DEBUG_MODE: "false"
  IBCTL_ROOT_PATH: ""
  IBCTL_COMMAND_HOST: 127.0.0.1
  IBCTL_COMMAND_PORT: "7462"
  IBCTL_COMMAND_HOST_PAPER: 127.0.0.1
  IBCTL_COMMAND_PORT_PAPER: "7463"
  IBCTL_NOTIFICATIONS_ENABLED: "false"
  IBCTL_NOTIFICATION_CHANNEL: ntfy
  IBCTL_NTFY_URL: https://ntfy.sh
  IBCTL_NTFY_TOPIC: ibctl
  IB_STATUS_CHECK_INTERVAL: "300"
  IB_STATUS_REGION: NA

secretEnv:
  TWS_USERID: your-ib-username
  TWS_PASSWORD: your-ib-password
  TWS_USERID_PAPER: ""
  TWS_PASSWORD_PAPER: ""
  TWOFACTOR_CODE: ""
  VNC_SERVER_PASSWORD: ""
  IBCTL_DASHBOARD_TOKEN: change-me
  IBCTL_NTFY_TOKEN: ""
  IBCTL_SLACK_WEBHOOK_URL: ""
  IBCTL_TELEGRAM_BOT_TOKEN: ""
  IBCTL_TELEGRAM_CHAT_ID: ""

extraEnv: []
extraEnvFrom: []

probes:
  liveness:
    enabled: true
    tcpSocket:
      port: commandLive
    initialDelaySeconds: 90
    periodSeconds: 30
  readiness:
    enabled: true
    tcpSocket:
      port: commandLive
    initialDelaySeconds: 60
    periodSeconds: 15
