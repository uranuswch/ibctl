{% extends "base.html" %}
{% block content %}
<h2>Gateway VNC</h2>
<div style="margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;">
    <span style="color: #888; font-size: 13px;" id="vnc-status">Connecting...</span>
    <div>
        <button class="btn btn-primary" onclick="reconnectVnc()" style="padding: 6px 12px; font-size: 12px;">Reconnect</button>
    </div>
</div>
<div style="margin-bottom: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
    <input id="vnc-password"
           type="password"
           placeholder="Enter VNC password"
           autocomplete="current-password"
           style="min-width: 220px; padding: 7px 10px; border: 1px solid #334155; border-radius: 6px; background: #020617; color: #f8fafc;">
    <span style="color: #94a3b8; font-size: 12px;">
        {% if vnc_password_configured %}
        Password is required and must be entered manually in the browser.
        {% else %}
        VNC password is not configured on the server.
        {% endif %}
    </span>
</div>
<div id="vnc-container" style="border: 1px solid #16213e; border-radius: 8px; overflow: hidden; background: #000; width: 100%; height: 70vh;">
</div>
<script type="module">
    import RFB from '{{ root_path }}/static/novnc/core/rfb.js';

    let rfb;
    let reconnectTimer = null;
    const host = '{{ request.headers.get("host", "localhost").split(":")[0] }}';
    const port = {{ novnc_port }};
    const wsScheme = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    const url = wsScheme + host + ':' + port;
    const statusEl = document.getElementById('vnc-status');
    const passwordEl = document.getElementById('vnc-password');

    function currentPassword() {
        return passwordEl.value || '';
    }

    function connect() {
        if (!currentPassword()) {
            statusEl.textContent = 'Enter the VNC password to connect';
            statusEl.style.color = '#fbbf24';
            return;
        }
        if (rfb) {
            rfb.disconnect();
        }
        if (reconnectTimer) {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
        }
        statusEl.textContent = 'Connecting to ' + url + '...';
        statusEl.style.color = '#fbbf24';

        try {
            rfb = new RFB(
                document.getElementById('vnc-container'),
                url
            );
            rfb.scaleViewport = true;
            rfb.resizeSession = false;
            rfb.background = '#000000';

            rfb.addEventListener('connect', () => {
                statusEl.textContent = 'Connected';
                statusEl.style.color = '#4ade80';
            });
            rfb.addEventListener('disconnect', (e) => {
                statusEl.textContent = 'Disconnected' + (e.detail.clean ? '' : ' (error)');
                statusEl.style.color = '#ef4444';
                // Auto-reconnect after 3s
                reconnectTimer = setTimeout(connect, 3000);
            });
            rfb.addEventListener('credentialsrequired', () => {
                const password = currentPassword();
                if (!password) {
                    statusEl.textContent = 'VNC password required';
                    statusEl.style.color = '#ef4444';
                    return;
                }
                rfb.sendCredentials({ password });
            });
        } catch (e) {
            statusEl.textContent = 'Error: ' + e.message;
            statusEl.style.color = '#ef4444';
            reconnectTimer = setTimeout(connect, 5000);
        }
    }

    window.reconnectVnc = connect;
    passwordEl.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            event.preventDefault();
            connect();
        }
    });
</script>
{% endblock %}
