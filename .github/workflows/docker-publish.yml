name: Docker Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      gateway_version:
        description: IB Gateway version to bake into the image
        required: false
        default: "10.45.1b"
        type: string
      gateway_channel:
        description: IB Gateway release channel
        required: false
        default: "latest"
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and push multi-arch Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [ "$VERSION" = "${GITHUB_REF_NAME}" ]; then
            VERSION=$(git rev-parse --short HEAD)
          fi
          MINOR=${VERSION%.*}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT

      - name: Resolve Gateway build args
        id: gateway
        run: |
          GATEWAY_VERSION="${{ github.event.inputs.gateway_version }}"
          GATEWAY_CHANNEL="${{ github.event.inputs.gateway_channel }}"

          if [ -z "$GATEWAY_VERSION" ]; then
            GATEWAY_VERSION="10.45.1b"
          fi
          if [ -z "$GATEWAY_CHANNEL" ]; then
            GATEWAY_CHANNEL="latest"
          fi

          echo "version=$GATEWAY_VERSION" >> $GITHUB_OUTPUT
          echo "channel=$GATEWAY_CHANNEL" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            IB_GATEWAY_VERSION=${{ steps.gateway.outputs.version }}
            IB_GATEWAY_CHANNEL=${{ steps.gateway.outputs.channel }}
            IBCTL_BUILD_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/uranuswch/ibctl:latest
            ghcr.io/uranuswch/ibctl:${{ steps.version.outputs.version }}
            ghcr.io/uranuswch/ibctl:${{ steps.version.outputs.minor }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
